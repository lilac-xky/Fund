spring:
  profiles:
    active: dev
  application:
    name: lilac-fund
  servlet:
    multipart:
      max-file-size: 10MB
  sql:
    init:
      # 业务表结构随应用启动执行，脚本全部使用 IF NOT EXISTS，可重复执行
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
server:
  servlet:
    context-path: /api

mybatis-flex:
  configuration:
    # 数据库字段统一驼峰，实体属性与列名同名，关闭下划线转换
    map-underscore-to-camel-case: false
    # 一级缓存只在一个语句内生效，避免同一事务里读到写入前的旧值
    local-cache-scope: statement
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

fund:
  data:
    # 复盘 CSV、操作日志、未送达邮件留存的本地根目录
    root: data
  adapter:
    http:
      # 东财等公开源对无 UA 的请求直接拒绝，统一带浏览器 UA
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"
      connect-timeout-ms: 5000
      read-timeout-ms: 15000
    eastmoney:
      fund-universe-url: "https://fund.eastmoney.com/js/fundcode_search.js"
      fund-detail-url: "https://fundf10.eastmoney.com/jbgk_{code}.html"
      # 净值与季末仓位取自 pingzhongdata 非正式 JS，无版本承诺
      fund-pingzhong-url: "https://fund.eastmoney.com/pingzhongdata/{code}.js"
      # 重仓股与债券持仓取自 fundf10，{kind} 为 jjcc/zqcc，month 决定中报年报是否展开全量
      fund-holding-url: "https://fundf10.eastmoney.com/FundArchivesDatas.aspx?type={kind}&code={code}&topline=100&year={year}&month={month}"
      # fundf10 与公告接口不带 Referer 一律返回 404，实测必带
      referer: "https://fundf10.eastmoney.com/"
      # 定期报告公告列表，用于取各报告期的披露日
      fund-announcement-url: "https://api.fund.eastmoney.com/f10/JJGG?fundcode={code}&pageIndex=1&pageSize=30&type=3&_=1"
      # 返回给前端的净值序列长度，供指标与页面复用
      net-worth-history-days: 400
      # 基金全集缓存最长保留天数，过期后下次消歧自动刷新
      catalog-max-age-days: 7
    tencent:
      quote-url: "https://qt.gtimg.cn/q="
      # 日线前复权地址，{symbol} 带交易所前缀，{limit} 为返回根数；该接口一次只认一个 param
      kline-url: "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param={symbol},day,,,{limit},qfq"
      # 港股必须走 hkfqkline，通用接口对 hk 前缀返回 501
      hk-kline-url: "https://web.ifzq.gtimg.cn/appstock/app/hkfqkline/get?param={symbol},day,,,{limit},qfq"
    sina:
      # 新浪实时行情不带 Referer 一律返回 Forbidden
      referer: "https://finance.sina.com.cn"
      quote-url: "https://hq.sinajs.cn/list="
      # 新浪日线不复权，只能作备用源，使用时须标注 adjusted=false
      kline-url: "https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData?symbol={symbol}&scale=240&ma=no&datalen={limit}"
      # 新浪外汇日线，东财 133.HKDCNH 已被限流，腾讯无历史
      forex-daily-url: "https://vip.stock.finance.sina.com.cn/forex/api/jsonp.php/var%20_=/NewForexService.getDayKLine?symbol={pair}"
      forex-quote-url: "https://hq.sinajs.cn/list={pair}"
    quote:
      # 单次批量请求的标的上限，超过则拆成多个请求
      batch-size: 60
      # 行情缓存粒度，秒；盘中同一标的 5 分钟内不重复取数
      cache-ttl-seconds: 300
      # 历史日线默认返回根数，供滚动收益与 β 估计复用
      history-limit: 60
    csindex:
      # 中证指数官网估值文件，老式 .xls，只含中证与部分深证系列，国证系列返回 404
      indicator-url: "https://oss-ch.csindex.com.cn/static/html/csindex/public/uploads/file/autofile/indicator/{code}indicator.xls"
      # 股息率超过该天数即标为数据过期，过期不得参与加减仓建议；股息率是慢变量，按周频抓取
      stale-days: 7
  estimate:
    # 单次预估的持仓上限，超限分批并提示，不静默丢弃；PRD 第 9 节上限为 30 只
    max-items: 30
    tier:
      # A 档点估计的中位绝对误差上限，百分点
      a-mae-limit: 0.3
      # 股票型、场内 ETF、红利、黄金的误差阈值，百分点
      stock-error-threshold: 0.3
      # 债券型的误差阈值，百分点；债券日波动本身极小，套用 0.3 阈值会失去意义
      bond-error-threshold: 0.10
      # 方向命中判定的涨跌下限，百分点；两侧都超过该值才比较方向
      direction-floor: 0.05
      # 混合型区间覆盖率下限，实际值落在区间内的比例
      interval-coverage-min: 0.80
      # 连续超阈值多少期后给出「建议停用该基金预估」提示
      suspend-consecutive-days: 3
      # B 档要求的方向准确率下限
      b-direction-accuracy: 0.85
      # B 档要求的区间宽与波动之比上限，超过说明区间没有信息量
      b-width-ratio: 1.0
    history:
      # 档位判定的长窗口，交易日
      window: 60
      # 与长窗口交叉校验的短窗口，交易日
      short-window: 20
      # 不足该样本数时按类型给默认档，不凭少量样本定档
      min-samples: 20
    interval:
      # 区间半宽的 sigma 倍数，1.64 对应正态下约 90% 覆盖率
      sigma-factor: 1.64
      # 无历史误差时的默认误差标准差，百分点
      default-sigma: 0.3
    # 有效持仓覆盖率下限，百分点
    min-coverage: 10
    # 允许被剔除的持仓权重上限，百分点；超过说明数据不足，不出数
    max-excluded-weight: 30
    # 预估结果缓存保留时间，秒
    cache-ttl-seconds: 1800
    calibration:
      # 取当日实际净值时的回溯天数，覆盖净值公布延迟
      actual-lookback-days: 10
    gold:
      # 黄金代理标的，华安黄金 ETF
      proxy-code: "518880"
      # β 滚动窗口，交易日；实测 20 日窗口两只联接基金分别为 0.9134 / 0.9008
      window: 20
      # β 估计最少配对样本，不足时退化为直取代理
      min-pairs: 10
    bond:
      # 债券代理标的，国泰上证 5 年期国债 ETF
      proxy-code: "511010"
    confidence:
      # 高可信度要求的覆盖率下限，百分点
      high-coverage: 85
      # 高可信度允许的历史 MAE，百分点
      high-mae: 0.2
      # 中可信度要求的覆盖率下限，百分点
      medium-coverage: 60
      # 中可信度允许的历史 MAE，百分点
      medium-mae: 0.35
